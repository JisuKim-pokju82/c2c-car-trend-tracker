name: Daily 4-Platform C2C Competitor Tracker (Cloud 08:00 KST)

on:
  schedule:
    # 다중 분산 스케줄 (ubuntu-latest 고속 풀 사용 + 07:17 / 07:37 / 07:52 / 08:07 / 08:23 KST 다중 안전망)
    - cron: '17 22 * * *'
    - cron: '37 22 * * *'
    - cron: '52 22 * * *'
    - cron: '7 23 * * *'
    - cron: '23 23 * * *'
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force full re-collection even if today file exists'
        required: false
        default: 'false'

permissions:
  contents: write

jobs:
  collect-and-commit:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Seoul
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare Headless Browser Helper
        run: |
          pip install --quiet playwright || pip install --quiet --break-system-packages playwright || true

      - name: Run 4-Platform RAW & Portfolio Collector
        shell: pwsh
        run: |
          if ("${{ github.event.inputs.force }}" -eq "true") {
            pwsh -NoProfile -File "./collect_competitor_trend.ps1" -Force
          } else {
            pwsh -NoProfile -File "./collect_competitor_trend.ps1"
          }

      - name: Commit & Push Updated RAW Data & Dashboard Bundle
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add competitor_trend.json competitor_trend.csv competitor_trend_data.js snapshots/ raw_data/ database/
          git diff --staged --quiet
          if ($LASTEXITCODE -ne 0) {
            $dt = ([DateTimeOffset]::UtcNow.ToOffset([TimeSpan]::FromHours(9))).ToString("yyyy-MM-dd")
            git commit -m "chore(data): daily 08:00 KST C2C competitor trend & RAW data ($dt)"
            git fetch origin main
            git rebase origin/main
            if ($LASTEXITCODE -ne 0) {
              git rebase --abort
              Write-Host "Remote main already updated simultaneously; keeping newer remote commit."
              exit 0
            }
            git push origin main
          } else {
            Write-Host "Today's 4-platform data is already up to date."
          }
