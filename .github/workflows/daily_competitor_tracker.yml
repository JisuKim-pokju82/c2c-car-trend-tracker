name: Daily 4-Platform C2C Competitor Tracker (Cloud 08:00 KST)

on:
  schedule:
    # ubuntu-latest 고속 러너 + 오전 08:00 이전 완료를 보장하는 6단계 다중 분산 스케줄 (KST 06:47, 07:12, 07:32, 07:48, 08:03, 08:22)
    # 첫 실행 성공 시 이후 스케줄은 10초 내 자동 스킵되어 중복 커밋이 발생하지 않습니다.
    - cron: '47 21 * * *'
    - cron: '12 22 * * *'
    - cron: '32 22 * * *'
    - cron: '48 22 * * *'
    - cron: '3 23 * * *'
    - cron: '22 23 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force full re-collection'
        required: false
        default: 'false'

permissions:
  contents: write

jobs:
  collect-and-commit:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Seoul
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run 4-Platform RAW & Portfolio Collector
        shell: pwsh
        run: |
          if ("${{ github.event.inputs.force }}" -eq "true") {
            pwsh -NoProfile -File "./collect_competitor_trend.ps1" -Force
          } else {
            pwsh -NoProfile -File "./collect_competitor_trend.ps1"
          }

      - name: Commit & Push Updated RAW Data & Dashboard Bundle
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add competitor_trend.json competitor_trend.csv competitor_trend_data.js snapshots/ raw_data/ database/
          git diff --staged --quiet
          if ($LASTEXITCODE -ne 0) {
            $dt = ([DateTimeOffset]::UtcNow.ToOffset([TimeSpan]::FromHours(9))).ToString("yyyy-MM-dd")
            git commit -m "chore(data): daily 08:00 KST C2C competitor trend & RAW data ($dt)"
            git fetch origin main
            git rebase origin/main
            if ($LASTEXITCODE -ne 0) {
              git rebase --abort
              Write-Host "Remote main already updated simultaneously; keeping newer remote commit."
              exit 0
            }
            git push origin main
          } else {
            Write-Host "Today's 4-platform data is already up to date."
          }
